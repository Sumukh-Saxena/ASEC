[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asec"
version = "0.0.1"
description = "ASEC — AI-Assisted Event Coordination System (Phase 0 development foundation)"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
    "mypy==2.4.0",
]
# Optional HTTP transport (O12-1). The core stays dependency-free: installing
# the package without this extra must keep every non-API test green.
api = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["backend"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true